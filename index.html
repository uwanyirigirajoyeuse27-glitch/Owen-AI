<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owen AI — CBC Lesson Plan Generator</title>
<style>
:root{
  --purple:#6d35d8; --pink:#df2b9f; --ink:#202033; --muted:#6f7180;
  --bg:#f6f4fb; --card:#fff; --line:#ddd9e8;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:28px 18px 22px;background:linear-gradient(120deg,#5b2bd4,#df2b9f);color:#fff}
.wrap{max-width:1050px;margin:auto}
.brand{font-size:30px;font-weight:800;letter-spacing:.3px}
.tag{opacity:.9;margin-top:5px}
main{padding:24px 16px 50px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 8px 28px #2d1c5010;margin-bottom:18px}
h2{margin:0 0 16px;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid #cfc9dc;border-radius:10px;font:inherit;background:#fff}
textarea{min-height:78px;resize:vertical}
.full{grid-column:1/-1}
.generate{
 width:100%;border:0;border-radius:18px;padding:18px 22px;color:white;
 background:linear-gradient(100deg,#6230df,#df2b9f);font-size:20px;font-weight:800;
 cursor:pointer;box-shadow:0 10px 24px #6d35d84a
}
.generate:hover{filter:brightness(1.04)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}
button.secondary{border:1px solid #cfc9dc;background:white;padding:10px 14px;border-radius:10px;font-weight:700;cursor:pointer}
#output{display:none}
.lesson{border:1px solid #bbb;border-radius:4px;background:white;padding:18px;overflow:auto}
.lesson h1{text-align:center;font-size:21px;margin:0 0 12px}
.lesson .center{text-align:center}
.meta{width:100%;border-collapse:collapse;margin-bottom:10px}
.meta td{border:1px solid #aaa;padding:7px;font-size:12px}
.meta .label{font-weight:700;background:#f4f4f4}
.plan{width:100%;border-collapse:collapse;min-width:760px}
.plan th,.plan td{border:1px solid #999;padding:8px;vertical-align:top;font-size:12px}
.plan th{background:#f1eef8;text-align:center}
.plan .stage{font-weight:700;width:120px}
.small{font-size:12px;color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:12px;padding:10px}
@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.card{padding:16px}}
@media print{
 body{background:#fff}.no-print,header,footer{display:none!important}
 main{padding:0}.card{border:0;box-shadow:none;padding:0}.lesson{border:0}
}
</style>
</head>
<body>
<header>
 <div class="wrap">
  <div class="brand">✨ OWEN AI</div>
  <div class="tag">Rwanda CBC Lesson Plan Generator</div>
 </div>
</header>

<main class="wrap">
 <section class="card no-print">
  <h2>Create your lesson plan</h2>
  <div class="grid">
   <div class="field"><label>Language</label>
    <select id="language"><option value="en">English</option><option value="fr">Français</option><option value="rw">Kinyarwanda</option></select>
   </div>
   <div class="field"><label>School name</label><input id="school" value="EP Munoga"></div>
   <div class="field"><label>Teacher's name</label><input id="teacher" value="Uwanyirigira Joyeuse"></div>
   <div class="field"><label>Term</label><select id="term"><option>I</option><option>II</option><option>III</option></select></div>
   <div class="field"><label>Date</label><input id="date" type="date"></div>
   <div class="field"><label>Subject / Branche</label><input id="subject" placeholder="e.g. French"></div>
   <div class="field"><label>Class</label><select id="class"><option>P1</option><option>P2</option><option>P3</option><option>P4</option><option selected>P5</option><option>P6</option></select></div>
   <div class="field"><label>Context / Unit</label><input id="context" placeholder="e.g. Unit 5 — Dates and months"></div>
   <div class="field"><label>Lesson number</label><input id="lessonNo" placeholder="4 of 8"></div>
   <div class="field"><label>Duration</label><input id="duration" value="40 min"></div>
   <div class="field"><label>Number of learners</label><input id="learners" type="number" value="43"></div>
   <div class="field"><label>Special educational needs</label><input id="sen" value="0 — No special educational needs identified"></div>
   <div class="field full"><label>Lesson title / topic</label><input id="title" placeholder="Enter the lesson topic"></div>
   <div class="field full"><label>Optional extra instructions</label><textarea id="extra" placeholder="e.g. Use group work, local materials, or focus on a particular competence."></textarea></div>
  </div>
  <br>
  <button class="generate" onclick="generatePlan()">✨ Generate Lesson Plan →</button>
  <p class="small">Prototype: the button creates the school template from the information entered. An AI service can be connected later for richer subject-specific content.</p>
 </section>

 <section id="output" class="card">
  <div class="actions no-print">
   <button class="secondary" onclick="window.print()">🖨️ Print</button>
   <button class="secondary" onclick="downloadHTML()">📄 Download</button>
   <button class="secondary" onclick="document.getElementById('output').style.display='none';window.scrollTo({top:0,behavior:'smooth'})">✏️ Edit</button>
  </div>
  <div id="lesson" class="lesson"></div>
 </section>
</main>
<footer>Owen AI • CBC Lesson Plan Generator</footer>

<script>
const labels={
 en:{head:"LESSON PLAN",school:"School Name",teacher:"Teacher's name",term:"Term",date:"Date",subject:"Subject",cls:"Class",context:"Context",num:"Lesson Number",duration:"Duration",learners:"Number of Learners",sen:"Types of Special Educational Needs and number of learners concerned",competence:"Key Competence",title:"Lesson Title",objective:"Operational Objective of the Lesson",place:"Place of the Lesson",materials:"Teaching/Learning Materials",refs:"References",steps:"Lesson Steps and Duration",activities:"Description of Teaching and Learning Activities",ta:"Teacher Activities",la:"Learner Activities",gc:"Generic Competences and Cross-cutting Issues + brief explanation",intro:"Introduction",dev:"Development of the lesson",con:"Conclusion",auto:"Self-evaluation"},
 fr:{head:"FICHE DE LEÇON",school:"Nom de l'école",teacher:"Nom de l'enseignant",term:"Trimestre",date:"Date",subject:"Branche",cls:"Classe",context:"Contexte",num:"Leçon Numéro",duration:"Durée",learners:"Nombre d'apprenants",sen:"Types de besoins particuliers et nombre d'apprenants concernés",competence:"Compétence clé",title:"Titre de la leçon",objective:"Objectif opérationnel de la leçon",place:"Lieu de la leçon",materials:"Matériel didactique",refs:"Références",steps:"Étapes de la leçon et durée",activities:"Description des activités d'enseignement et d'apprentissage",ta:"Activités de l'enseignant",la:"Activités des apprenants",gc:"Compétences génériques et thèmes transversaux + quelques explications",intro:"Introduction",dev:"Développement de la leçon",con:"Conclusion",auto:"Auto-évaluation"},
 rw:{head:"GAHUNDA Y’ISOMO",school:"Izina ry’ikigo",teacher:"Izina ry’umwarimu",term:"Igihembwe",date:"Itariki",subject:"Isomo",cls:"Icyiciro",context:"Imiterere / Umutwe",num:"Nimero y’isomo",duration:"Igihe",learners:"Umubare w’abanyeshuri",sen:"Ubwoko bw’ibyifuzo byihariye n’umubare w’ababikeneye",competence:"Ubushobozi bw’ingenzi",title:"Umutwe w’isomo",objective:"Intego y’isomo",place:"Aho isomo ribera",materials:"Ibikoresho byifashishwa",refs:"Aho amakuru yakuwe",steps:"Intambwe z’isomo n’igihe",activities:"Ibisobanuro by’ibikorwa byo kwigisha no kwiga",ta:"Ibikorwa by’umwarimu",la:"Ibikorwa by’abanyeshuri",gc:"Ubushobozi rusange n’insanganyamatsiko + ibisobanuro",intro:"Intangiriro",dev:"Iterambere ry’isomo",con:"Umusozo",auto:"Isuzuma ry’umwarimu"}
};

function v(id){return document.getElementById(id).value || "—"}
function generatePlan(){
 const L=labels[document.getElementById('language').value], title=v('title'), subject=v('subject');
 const lang=document.getElementById('language').value;
 let competence,objective,place,materials,refs,introT,introL,devT,devL,conT,conL,gc;
 if(lang==="fr"){
  competence=`Les apprenants seront capables de mobiliser leurs connaissances et leurs compétences pour comprendre, expliquer et appliquer correctement les notions liées à « ${title} », en utilisant le vocabulaire et les language skills appropriés au niveau ${v("class")}.`;
  objective=`À la fin de la leçon, les apprenants seront capables de : (1) identifier les notions essentielles de « ${title} » ; (2) expliquer leur utilisation ; (3) les appliquer dans des activités guidées et individuelles ; et (4) démontrer leur compréhension lors de l’évaluation.`;
  place="En classe, avec possibilité d’utiliser l’espace de l’école si l’activité l’exige."; materials=`Manuel de ${subject}, tableau, cahiers, fiches d’activités, images/objets ou autres ressources locales pertinentes au thème « ${title} ». `; refs=`Manuel/curriculum de ${subject} pour ${v("class")}, ressources pédagogiques disponibles à l’école et documents indiqués par l’enseignant.`;
  introT="Salue les apprenants, vérifie les présences, révise la leçon précédente, introduit le sujet et présente les objectifs.";
  introL="Répondent aux salutations, rappellent les connaissances antérieures, écoutent le sujet et posent des questions.";
  devT="Organise les apprenants en groupes, présente les notions clés, fait une démonstration, guide les activités, observe, pose des questions et donne un feedback.";
  devL="Forment les groupes, suivent la démonstration, travaillent ensemble, discutent, présentent leurs réponses et corrigent leur travail.";
  conT="Guide la synthèse, pose quelques questions d'évaluation, donne un exercice à faire à la maison et annonce la prochaine leçon.";
  conL="Résument les apprentissages, répondent aux questions, s'autoévaluent et notent le devoir.";
  gc="Communication; pensée critique; coopération; éducation inclusive; créativité et innovation.";
 } else if(lang==="rw"){
  competence=`Abanyeshuri bazashobora gukoresha ubumenyi n’ubushobozi bwabo mu gusobanukirwa, gusobanura no gushyira mu bikorwa neza ibijyanye na « ${title} », bakoresheje amagambo n’uburyo bwo kwiga bihuye n’icyiciro ${v("class")}.`;
  objective=`Isomo rirangiye, abanyeshuri bazashobora: (1) kumenya ingingo z’ingenzi za « ${title} »; (2) kuzisobanura; (3) kuzishyira mu bikorwa mu myitozo iyobowe n’umwarimu no ku giti cyabo; no (4) kugaragaza ibyo basobanukiwe mu isuzuma.`;
  place="Mu ishuri; cyangwa ahantu h’ikigo hakenewe bitewe n’igikorwa cy’isomo."; materials=`Igitabo cya ${subject}, ikibaho, amakayi, impapuro z’imyitozo, amashusho/ibintu bifatika cyangwa ibindi bikoresho biboneka bijyanye na « ${title} ». `; refs=`Igitabo/curriculum bya ${subject} bya ${v("class")}, ibikoresho by’inyigisho biboneka ku kigo n’izindi nyandiko umwarimu yerekanye.`;
  introT="Arasuhuza abanyeshuri, akagenzura abitabiriye, agasubiramo isomo ryabanje, akerekana umutwe w’isomo n’intego.";
  introL="Basubiza indamutso, basubiramo ibyo bize, batega amatwi kandi babaza ibibazo.";
  devT="Agabanya abanyeshuri mu matsinda, asobanura ingingo z’ingenzi, atanga urugero, ayobora ibikorwa, akurikirana kandi atanga inama.";
  devL="Bakorera mu matsinda, bakurikira urugero, baganira, bakora imyitozo, batanga ibisubizo kandi bakosora.";
  conT="Ayobora isubiramo ry’ingenzi, akabaza ibibazo byo gusuzuma, agatanga umukoro kandi akavuga ku isomo rikurikira.";
  conL="Basubiramo ibyo bize, basubiza ibibazo, bisuzuma kandi bandika umukoro.";
  gc="Itumanaho; gutekereza neza; ubufatanye; uburezi budaheza; guhanga udushya.";
 } else {
  competence=`Learners will be able to mobilize relevant knowledge and skills to understand, explain and correctly apply concepts related to “${title}”, using language and skills appropriate to ${v("class")}.`;
  objective=`By the end of the lesson, learners will be able to: (1) identify the key concepts in “${title}”; (2) explain their use; (3) apply them in guided and individual activities; and (4) demonstrate understanding during assessment.`;
  place="Inside the classroom, with use of the school environment when required by the activity."; materials=`${subject} textbook, board, exercise books, activity sheets, pictures/objects or other locally available resources relevant to “${title}”.`; refs=`${subject} curriculum/textbook for ${v("class")}, available school teaching resources, and references specified by the teacher.`;
  introT="Greets learners, checks attendance, reviews the previous lesson, introduces the topic and shares the lesson objectives.";
  introL="Respond to greetings, recall previous learning, listen to the topic and ask questions for clarification.";
  devT="Organizes learners into groups, presents key concepts, demonstrates the main idea, guides activities, observes, asks probing questions and gives feedback.";
  devL="Form groups, follow the demonstration, work collaboratively, discuss ideas, present answers and make corrections.";
  conT="Guides a summary, asks a few assessment questions, gives homework and links the lesson to the next lesson.";
  conL="Summarize what they learned, answer questions, self-assess their progress and write down homework.";
  gc="Communication; critical thinking; cooperation; inclusive education; creativity and innovation.";
 }
 const date=v('date');
 const html=`
 <h1>${L.head}</h1>
 <table class="meta">
 <tr><td class="label">${L.school}</td><td>${v('school')}</td><td class="label">${L.teacher}</td><td>${v('teacher')}</td></tr>
 <tr><td class="label">${L.term}</td><td>${v('term')}</td><td class="label">${L.date}</td><td>${date==="—"?"—":new Date(date+"T00:00:00").toLocaleDateString()}</td></tr>
 <tr><td class="label">${L.subject}</td><td>${subject}</td><td class="label">${L.cls}</td><td>${v('class')}</td></tr>
 <tr><td class="label">${L.context}</td><td>${v('context')}<br><span class="small">${lang==="fr"?"Contexte d’apprentissage : les apprenants sont placés dans une situation proche de leur vie quotidienne afin de mobiliser leurs connaissances et de participer activement à la leçon.":lang==="rw"?"Imiterere y’isomo: abanyeshuri bashyirwa mu gikorwa gifitanye isano n’ubuzima bwabo bwa buri munsi kugira ngo bakoreshe ibyo basanzwe bazi kandi bagire uruhare rugaragara mu isomo.":"Learning context: learners are placed in a situation connected to everyday life so they can activate prior knowledge and participate actively in the lesson."}</span></td><td class="label">${L.num}</td><td>${v('lessonNo')}</td></tr>
 <tr><td class="label">${L.duration}</td><td>${v('duration')}</td><td class="label">${L.learners}</td><td>${v('learners')}</td></tr>
 </table>
 <table class="meta">
 <tr><td class="label">${L.sen}</td><td>${v('sen')}</td></tr>
 <tr><td class="label">${L.competence}</td><td>${competence}</td></tr>
 <tr><td class="label">${L.title}</td><td>${title}</td></tr>
 <tr><td class="label">${L.objective}</td><td>${objective}</td></tr>
 <tr><td class="label">${L.place}</td><td>${place}</td></tr>
 <tr><td class="label">${L.materials}</td><td>${materials}</td></tr>
 <tr><td class="label">${L.refs}</td><td>${refs}</td></tr>
 </table>
 <table class="plan">
 <tr><th class="stage">${L.steps}</th><th colspan="2">${L.activities}</th><th>${L.gc}</th></tr>
 <tr><th></th><th>${L.ta}</th><th>${L.la}</th><th></th></tr>
 <tr><td class="stage">${L.intro}<br>6 minutes</td><td>${introT}</td><td>${introL}</td><td>${gc}<br><br>Respectful participation and active communication.</td></tr>
 <tr><td class="stage">${L.dev}<br>24 minutes</td><td>${devT}</td><td>${devL}</td><td>${gc}<br><br>Mixed-ability participation and collaborative problem solving.</td></tr>
 <tr><td class="stage">${L.con}<br>10 minutes</td><td>${conT}</td><td>${conL}</td><td>${gc}<br><br>Reflection, confidence and continuous learning.</td></tr>
 </table>
 <table class="meta" style="margin-top:10px"><tr><td class="label">${L.auto}</td><td>${lang==="fr"?"À compléter après la leçon : Les objectifs ont-ils été atteints ? Quelles améliorations sont nécessaires ?":"To be completed after lesson delivery: Did learners achieve the objective? What needs improvement?"}</td></tr></table>
 `;
 document.getElementById('lesson').innerHTML=html;
 document.getElementById('output').style.display='block';
 document.getElementById('output').scrollIntoView({behavior:'smooth'});
}
function downloadHTML(){
 const content=document.getElementById('lesson').innerHTML;
 const blob=new Blob([`<!doctype html><html><head><meta charset="utf-8"><title>Owen AI Lesson Plan</title><style>body{font-family:Arial;padding:25px}.meta,.plan{width:100%;border-collapse:collapse;margin-bottom:10px}.meta td,.plan th,.plan td{border:1px solid #999;padding:8px;vertical-align:top}.label,.plan th{font-weight:700;background:#f1eef8}h1{text-align:center}</style></head><body>${content}</body></html>`],{type:"text/html"});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download="Owen_AI_Lesson_Plan.html";a.click();URL.revokeObjectURL(a.href);
}
</script>
</body>
</html>
